version: '3.8'

services:

  mqtt_service:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf


  iot_api:
    build: .
    container_name: fastapi_server
    ports:
      - "8000:8000"
    depends_on:
      - mqtt_service
    restart: always